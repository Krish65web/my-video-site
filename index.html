
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Videos</title>
  <meta name="description" content="Discover the latest videos and updates.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101018;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 12px;
      background: #20202d;
    }

    h1 {
      color: #ffcc33;
    }

    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .video-button {
      display: inline-block;
      background: #e50935;
      color: white;
      padding: 17px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 20px 0;
    }

    .video-button:hover {
      background: #b90629;
    }

    .ad-box {
      margin: 30px auto;
      padding: 25px 10px;
      border: 1px dashed #777;
      color: #ccc;
      min-height: 100px;
    }

    footer {
      padding: 20px;
      background: #20202d;
      color: #ccc;
      font-size: 14px;
    }

    a {
      color: #ffcc33;
    }
  </style>
</head>

<body>
  <header>
    <h1>Latest Videos</h1>
    <p>Discover videos and new updates</p>
  </header>

  <main>
    <h2>Watch the Latest Videos</h2>
    <p>Click below to explore our video collection.</p>

    <a class="video-button"
       href="https://www.youtube.com/"
       target="_blank"
       rel="noopener noreferrer">
      ▶ CLICK HERE TO WATCH VIDEOS
    </a>

    <div class="ad-box">
      <strong>Advertisement</strong>
      <p>Your approved ad will appear here.</p>
    </div>

    <p>More videos and updates coming soon.</p>
  </main>

  <footer>
    <p>© 2026 Latest Videos</p>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
